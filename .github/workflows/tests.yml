name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # WeasyPrint (PDF export) needs these system libraries.
      - name: System libraries for PDF export
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run the test suite (SQLite, never your real database)
        env:
          DATABASE_URL: ""
          DJANGO_SECRET_KEY: ci-only-not-a-real-secret
        run: python manage.py test
