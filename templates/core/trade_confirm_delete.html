{% extends "base.html" %}
{% block title %}Delete level{% endblock %}
{% block content %}
<div class="container-xxl">
  <div class="auth-wrap">
    <div class="panel panel-body auth-card">
      <span class="icon-chip mb-3" style="background:var(--c-danger-soft);color:var(--c-danger)"><i class="bi bi-trash"></i></span>
      <h1 class="fs-4 mb-2">Delete “{{ trade.name }}”?</h1>
      <p class="text-muted-2">This permanently removes the level. It can't be undone.</p>

      <form method="post" class="d-flex flex-wrap gap-2">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger"><i class="bi bi-trash me-1"></i>Delete permanently</button>
        <a href="{% url 'core:curriculum' %}" class="btn btn-outline-secondary">Cancel</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
