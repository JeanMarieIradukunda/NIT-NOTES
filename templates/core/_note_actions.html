<a class="btn btn-outline-secondary btn-sm" href="{% url 'core:note_edit' n.pk %}"><i class="bi bi-pencil me-1"></i>Edit</a>
<form method="post" action="{% url 'core:note_toggle_publish' n.pk %}" class="d-inline">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  {% if n.is_published %}
  <button class="btn btn-outline-secondary btn-sm btn-toggle-publish" type="submit"><i class="bi bi-eye-slash me-1"></i>Unpublish</button>
  {% else %}
  <button class="btn btn-outline-primary btn-sm btn-toggle-publish" type="submit"><i class="bi bi-cloud-arrow-up me-1"></i>Publish</button>
  {% endif %}
</form>
<a class="btn btn-outline-danger btn-sm" href="{% url 'core:note_delete' n.pk %}" aria-label="Delete {{ n.title }}" title="Delete"><i class="bi bi-trash"></i></a>
