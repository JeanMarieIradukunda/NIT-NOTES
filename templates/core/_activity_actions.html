<a class="btn btn-outline-secondary btn-sm" href="{% url 'core:activity_edit' a.pk %}"><i class="bi bi-pencil me-1"></i>Edit</a>
<form method="post" action="{% url 'core:activity_toggle_publish' a.pk %}" class="d-inline">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  {% if a.is_published %}
  <button class="btn btn-outline-secondary btn-sm btn-toggle-publish" type="submit"><i class="bi bi-eye-slash me-1"></i>Unpublish</button>
  {% else %}
  <button class="btn btn-outline-primary btn-sm btn-toggle-publish" type="submit"><i class="bi bi-cloud-arrow-up me-1"></i>Publish</button>
  {% endif %}
</form>
<a class="btn btn-outline-secondary btn-sm" href="{% url 'core:activity_file' a.pk %}" target="_blank" rel="noopener" aria-label="View {{ a.title }}" title="View"><i class="bi bi-eye"></i></a>
<a class="btn btn-outline-danger btn-sm" href="{% url 'core:activity_delete' a.pk %}" aria-label="Delete {{ a.title }}" title="Delete"><i class="bi bi-trash"></i></a>
